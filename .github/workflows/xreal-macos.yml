# Dedicated XREAL release workflow.
name: XREAL macOS build

on:
  push:
    branches: [xreal]
    tags: ['xreal-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xreal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: brew install meson ninja pkgconf ffmpeg libass libplacebo luajit zlib bzip2 vulkan-loader molten-vk shaderc
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.XREAL_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.XREAL_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            # Releases must keep the permanent signature for self-updates.
            if [[ "$GITHUB_REF" == refs/tags/xreal-v* ]]; then
              echo "::error::Signing certificate secrets are missing"; exit 1
            fi
            echo "No signing certificate; building ad-hoc"; exit 0
          fi
          keychain="$RUNNER_TEMP/xreal-signing.keychain-db"
          password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign looks identities up through the user search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          rm "$RUNNER_TEMP/signing.p12"
          echo "XREAL_SIGN_IDENTITY=XREAL VR Player Code Signing" >> "$GITHUB_ENV"
          echo "XREAL_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, test and package XREAL VR Player
        run: bash xreal/build.sh
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: XREAL-VR-Player-arm64
          path: |
            dist/XREAL-VR-Player-arm64.dmg
            dist/XREAL-VR-Player-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XREAL-test-reports
          path: |
            build/meson-logs/testlog.txt
            xreal/test-output/report.json
            xreal/test-output/optimization-audit.json
            xreal/test-output/shader-validation.json
            xreal/test-output/mpv.log
            xreal/test-output/bundle-startup.json
            xreal/test-output/bundle-startup.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/xreal-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: XREAL-VR-Player-arm64
          path: installer
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" installer/*
          --repo "$GITHUB_REPOSITORY"
          --title "XREAL VR Player $GITHUB_REF_NAME"
          --notes "Apple Silicon / macOS 15+. Separate mpv-based player. See README and the included quick start. Head-pose input is not implemented; enable SBS mode on the glasses. Ad-hoc signed, not notarized."
