# All other ordinary mpv playback shortcuts remain available.
w script-message xreal-look 0 5
s script-message xreal-look 0 -5
a script-message xreal-look -5 0
d script-message xreal-look 5 0
r script-message xreal-reset
e script-message xreal-swap
[ script-message xreal-fov -5
] script-message xreal-fov 5
h script-message xreal-status
TAB script-message xreal-status
MBTN_LEFT cycle pause
MBTN_LEFT_DBL cycle fullscreen
f cycle fullscreen
ESC set fullscreen no
